services:
  # PostgreSQL Instance Store / Storage backend
  postgres:
    image: postgres:17.10
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: source_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # pgAdmin 4 Management Console
  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # Dagster Webserver (UI)
  dagster_webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dagster_webserver
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - workspace.yaml
    ports:
      - "3000:3000"
    environment:
      DAGSTER_CURRENT_IMAGE: dagster_webserver
      DAGSTER_PG_PASSWORD: dagster_password
      DUCKDB_DATABASE_PATH: /opt/dagster/app/duckdb_data/main.duckdb
    volumes:
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
      - duckdb_data:/opt/dagster/app/duckdb_data
    depends_on:
      postgres:
        condition: service_healthy

  # Dagster Daemon (Schedules, Sensors, Run Queue)
  dagster_daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dagster_daemon
    entrypoint:
      - dagster-daemon
      - run
    environment:
      DAGSTER_CURRENT_IMAGE: dagster_daemon
      DAGSTER_PG_PASSWORD: dagster_password
      DUCKDB_DATABASE_PATH: /opt/dagster/app/duckdb_data/main.duckdb
    volumes:
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
      - duckdb_data:/opt/dagster/app/duckdb_data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  duckdb_data:
  pgadmin_data: