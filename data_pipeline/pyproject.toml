[project]
name = "data_pipeline"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "dagster==1.13.22",
    "dagster-duckdb>=0.29.22",
    "dagster-webserver>=1.13.22",
    "dotenv>=0.9.9",
    "duckdb>=1.5.5",
    "ipykernel>=7.3.0",
    "pandas>=2.3.3",
    "polars>=1.44.2",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=25.0.1",
    "sqlalchemy>=2.0.54",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "data_pipeline"
registry_modules = [
    "data_pipeline.components.*",
]


