[project]
name = "pricing-agent"
version = "0.1.0"
description = "Combines demand forecast + competitor prices into a price recommendation"
requires-python = ">=3.12"
dependencies = [
    "agent-schemas"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricing_agent"]

[tool.uv.sources]
agent-schemas = { workspace = true }
