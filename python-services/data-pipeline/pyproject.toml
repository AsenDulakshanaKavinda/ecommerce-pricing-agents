[project]
name = "data-pipeline"
version = "0.1.0"
description = "Data pipeline for the ML model"
requires-python = ">=3.12"
dependencies = [
    "agent-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline"]

[tool.uv.sources]
agent-schemas = { workspace = true }
