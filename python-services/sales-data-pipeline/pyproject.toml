[project]
name = "sales-data-pipeline"
version = "0.1.0"
description = "Ingests and validates sales history feeding forecast-agent's training data"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.8.0",
    "pandas>=2.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.0",
    "pandera>=0.20.0",
    "mlflow>=2.10",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "dagster-duckdb>=0.29.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "dagster-webserver>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_data_pipeline"]

[tool.dagster]
module_name = "sales_data_pipeline.definitions"
