[project]
name = "orchestrator"
version = "0.1.0"
description = "LangGraph DAG wiring forecast -> {reorder, pricing} <- scraper -> explainer"
requires-python = ">=3.12"
dependencies = [
    "agent-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
agent-schemas = { workspace = true }
