[project]
name = "forecast-agent"
version = "0.1.0"
description = "Predicts demand per SKU; experiment-tracked with MLflow"
requires-python = ">=3.12"
dependencies = [
    "agent-schemas",
    "data-pipeline",
    "ipykernel>=7.3.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.2",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_agent"]

[tool.uv.sources]
agent-schemas = { workspace = true }
data-pipeline = { workspace = true }
