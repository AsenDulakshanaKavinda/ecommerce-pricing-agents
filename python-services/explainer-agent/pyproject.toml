[project]
name = "explainer-agent"
version = "0.1.0"
description = "Builds the human-readable daily brief from reorder + pricing recommendations"
requires-python = ">=3.12"
dependencies = [
    "agent-schemas",
    "fastmcp>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explainer_agent"]

[tool.uv.sources]
agent-schemas = { workspace = true }
