[project]
name = "reorder-agent"
version = "0.1.0"
description = "Stock level + lead-time reorder calculations"
requires-python = ">=3.12"
dependencies = [
    "agent-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reorder_agent"]

[tool.uv.sources]
agent-schemas = { workspace = true }
